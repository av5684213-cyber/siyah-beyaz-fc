name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run Tests
        run: npm test

      - name: Build Next.js
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.placeholder

  python-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          pip install flake8
          if [ -f python/requirements.txt ]; then pip install -r python/requirements.txt; fi

      - name: Run flake8
        run: flake8 python/ --ignore=E501,W503

      - name: Check Python syntax
        run: |
          python -m py_compile python/match_simulator.py
          python -m py_compile python/award_season.py
          python -m py_compile python/bot_actions.py
          python -m py_compile python/update_player_values.py
          python -m py_compile python/season_end_trigger.py
          python -m py_compile python/cron_youth_academy.py
